name: Build Anbar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create project files
        run: |
          sed -i 's/\r$//' setup.sh
          bash -n setup.sh && bash setup.sh

      - name: Pack source code
        run: |
          zip -r /tmp/Anbar-Source-Code.zip . -x ".git/*"
          mv /tmp/Anbar-Source-Code.zip .

      - name: Upload source zip
        uses: actions/upload-artifact@v4
        with:
          name: Anbar-Source-Code-ZIP
          path: Anbar-Source-Code.zip

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnbarApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
